<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pradolamata</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <h1>Contacto</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Historia</a></li>
            <li><a href="galeria.html">Galería</a></li>
        </ul>
    </nav>
    <main>
        <section>
            <h2>Rellene el formulario y dele a Enviar.</h2>
            <form action="" method="post">
                <table class="form-table">
                    <tr>
                        <td><label for="i_remitente">Remitente: </label></td>
                        <td><input type="text" id="i_remitente" name="remitente"></td>
                    </tr>
                    <tr>
                        <td><label for="i_email">Correo electrónico:</label></td>
                        <td><input type="email" id="i_email" name="email"></td>
                    </tr>
                    <tr>
                        <td><label for="i_phone">Teléfono:</label></td>
                        <td><input type="tel" id="i_phone" name="phone"></td>
                    </tr>
                    <tr>
                        <td><label for="ta_mensaje">Mensaje:</label></td>
                        <td>
                            <textarea name="mensaje" id="ta_mensaje" placeholder="Escribe tu mensaje aquí..."></textarea>
                        </td>
                    </tr>
                </table>
                <div>
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Borrar">
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>Página creada por Eneko Córdoba</p>
        <p>
            <a href="https://merindaddecuestaurria.burgos.es/pueblos/pradolamata" target="_blank">
                Más información
            </a>
        </p>
    </footer>
</body>

</html>
